<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flight Director — Splash (3 conceitos)</title>
<style>
  :root {
    --navy: #00002C;
    --navy-glow: #0B1150;
    --yellow: #FFC300;
    --white: #FFFFFF;
    --ease-out-soft: cubic-bezier(0.25, 1, 0.5, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-overshoot: cubic-bezier(0.34, 1.45, 0.64, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    background-color: var(--navy);
    /* Fundo aprovado: gradiente radial sutil de céu noturno */
    background-image: radial-gradient(ellipse 80% 60% at 50% 44%,
      var(--navy-glow) 0%, #04063C 36%, var(--navy) 74%);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; opacity: 0; animation: appear 1.2s var(--ease-out-soft) .2s forwards; }
  .stars::before {
    content: ''; position: absolute; width: 1.5px; height: 1.5px; border-radius: 50%;
    box-shadow:
      12vw 14vh 0 rgba(255,255,255,.28), 78vw 9vh 0 rgba(255,255,255,.22),
      88vw 31vh 0 rgba(255,255,255,.18), 6vw 46vh 0 rgba(255,255,255,.16),
      24vw 78vh 0 rgba(255,255,255,.2),  70vw 84vh 0 rgba(255,255,255,.24),
      92vw 66vh 0 rgba(255,255,255,.14), 40vw 7vh 0 rgba(255,255,255,.18),
      58vw 92vh 0 rgba(255,255,255,.12), 4vw 90vh 0 rgba(255,255,255,.16);
  }

  /* Cena em coordenadas de celular (390 x 780), centrada na tela */
  .scene { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
  .scene.active { display: block; }

  /* Seletor de protótipo (só para a revisão) */
  .picker {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; gap: 6px; padding: 5px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
  }
  .picker button {
    border: 0; border-radius: 999px; padding: 7px 11px; cursor: pointer;
    font-size: 11px; font-weight: 600; letter-spacing: .02em; white-space: nowrap;
    color: rgba(255,255,255,.7); background: transparent;
  }
  .picker button.on { background: #fff; color: var(--navy); }
  .hint { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 11px; color: rgba(255,255,255,.35); z-index: 5; }

  /* ---------- Peças comuns a todas as cenas ---------- */
  .part { transform-box: fill-box; will-change: transform, opacity; }
  .glyph { fill: var(--white); opacity: 0; transform-box: fill-box; will-change: transform, opacity; }
  .tag { opacity: 0; transform-box: fill-box; will-change: transform, opacity; }
  .glow { transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(.85);
          animation: pulse .8s var(--ease-out-soft) 2.6s forwards; }
  .shine { transform-box: view-box; opacity: 0; animation: sweep .8s var(--ease-in-out) 2.6s forwards; }

  /* =================================================================
     CONCEITO 1 — FLIGHT DIRECTOR (visor do cockpit)
     ================================================================= */
  .s1 .hud { opacity: 0; animation: appear .3s ease-out .05s forwards, vanish .35s ease-in 1.45s forwards; }
  .s1 .ladder { transform-box: view-box; transform-origin: 195px 343px;
                animation: roll 1.5s linear forwards; }
  .s1 .tape { transform-box: view-box; animation: scroll 1.6s var(--ease-out-soft) forwards; }
  .s1 .lockline { opacity: 1; animation: vanish .3s ease-out 1.5s forwards; }
  .s1 .bar { opacity: 0; transform-origin: 50% 50%; transform: scaleY(.12);
             animation: lock .45s var(--ease-overshoot) 1.5s forwards; }
  .s1 .horizon { animation: vanish .25s ease-out 1.6s forwards; }
  .s1 .wingL { opacity: 0; transform-origin: 100% 50%; transform: scaleX(0); animation: unfold .5s var(--ease-out-soft) 1.58s forwards; }
  .s1 .wingR { opacity: 0; transform-origin: 0% 50%;   transform: scaleX(0); animation: unfold .5s var(--ease-out-soft) 1.58s forwards; }
  .s1 .fpm { animation: vanish .2s ease-out 1.6s forwards; }
  .s1 .jet { opacity: 0; transform-origin: 50% 0%; transform: scale(.2); animation: grow .5s var(--ease-overshoot) 1.62s forwards; }
  .s1 .scan { transform-box: view-box; opacity: 0; animation: scan .55s var(--ease-in-out) 1.95s forwards; }
  .s1 .glyph { transform: translateY(0); animation: appear .3s ease-out forwards; animation-delay: calc(2.0s + var(--i) * 34ms); }
  .s1 .tag { animation: appear .45s var(--ease-out-soft) 2.4s forwards; }

  @keyframes roll {
    0%   { opacity: 0; transform: rotate(-24deg) translateY(58px); animation-timing-function: cubic-bezier(.3,.6,.4,1); }
    10%  { opacity: 1; }
    52%  { transform: rotate(7deg) translateY(-12px); animation-timing-function: cubic-bezier(.45,0,.4,1); }
    78%  { transform: rotate(-2deg) translateY(3px); animation-timing-function: cubic-bezier(.45,0,.4,1); }
    100% { opacity: 1; transform: rotate(0) translateY(0); }
  }
  @keyframes scroll { from { transform: translateY(0); } to { transform: translateY(-72px); } }
  @keyframes lock   { to { opacity: 1; transform: scaleY(1); } }
  @keyframes unfold { to { opacity: 1; transform: scaleX(1); } }
  @keyframes grow   { to { opacity: 1; transform: scale(1); } }
  @keyframes scan {
    0%   { opacity: 0; transform: translateX(0); }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(300px); }
  }

  /* =================================================================
     CONCEITO 2 — APROXIMAÇÃO NOTURNA (luzes de pista)
     ================================================================= */
  .s2 .edges { opacity: 0; animation: appear .4s ease-out forwards, vanish .4s ease-in 1.3s forwards; }
  .s2 .row { transform-box: view-box; transform-origin: 0 0; opacity: 0;
             animation: approach .78s cubic-bezier(.55,0,.85,.4) forwards; animation-delay: var(--d); }
  .s2 .bar { opacity: 0; transform-origin: 50% 50%; transform: translateY(var(--from)) scaleX(2.8);
             animation: settle .62s var(--ease-out-soft) forwards; animation-delay: var(--d); }
  .s2 .jet { opacity: 0; transform-origin: 50% 50%; transform: translateY(46px);
             animation: settle .55s var(--ease-out-soft) 1.5s forwards; }
  .s2 .wingL { opacity: 0; transform-origin: 100% 50%; transform: scaleX(0); animation: unfold .45s var(--ease-out-soft) 1.62s forwards; }
  .s2 .wingR { opacity: 0; transform-origin: 0% 50%;   transform: scaleX(0); animation: unfold .45s var(--ease-out-soft) 1.62s forwards; }
  .s2 .bloom { transform-box: fill-box; transform-origin: center; opacity: 0; animation: bloom .7s var(--ease-out-soft) 1.62s forwards; }
  .s2 .horizonline { transform-box: fill-box; transform-origin: center; opacity: 0; transform: scaleX(0);
                     animation: horizon .8s var(--ease-out-soft) 1.9s forwards; }
  .s2 .glyph { transform: translateY(12px);
               animation: rise .45s var(--ease-out-soft) forwards; animation-delay: calc(2.02s + var(--c) * 34ms); }
  .s2 .tag { transform: translateY(6px); animation: rise .5s var(--ease-out-soft) 2.38s forwards; }

  @keyframes approach {
    0%   { opacity: 0; transform: translate(195px, 343px) scale(.05); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: translate(195px, 980px) scale(5.2); }
  }
  @keyframes settle  { to { opacity: 1; transform: translateY(0) scaleX(1); } }
  @keyframes bloom   { 0% { opacity: 0; transform: scale(.4); } 35% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.5); } }
  @keyframes horizon { 0% { opacity: 0; transform: scaleX(0); } 30% { opacity: 1; } 70% { opacity: .9; transform: scaleX(1); } 100% { opacity: 0; transform: scaleX(1); } }
  @keyframes rise    { to { opacity: 1; transform: translateY(0); } }

  /* =================================================================
     CONCEITO 3 — DECOLAGEM COM RASTRO
     ================================================================= */
  .s3 .jet { opacity: 0; transform-origin: 50% 50%; transform: translateY(520px) scale(.55);
             animation: climb 1.3s var(--ease-out-soft) forwards; }
  .s3 .trail { fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
               animation: draw 1.25s var(--ease-out-soft) forwards, vanish .4s ease-out 1.3s forwards; }
  .s3 .trail.curl { animation: draw .3s var(--ease-out-soft) .95s forwards, vanish .3s ease-out 1.3s forwards; }
  .s3 .wingL { opacity: 0; transform-origin: 100% 50%; transform: scaleX(0); animation: unfold .55s var(--ease-out-soft) 1.18s forwards; }
  .s3 .wingR { opacity: 0; transform-origin: 0% 50%;   transform: scaleX(0); animation: unfold .55s var(--ease-out-soft) 1.18s forwards; }
  .s3 .cloud { transform-box: view-box; opacity: 0;
               animation: drift var(--t) linear forwards; animation-delay: var(--d); }
  .s3 .bar { opacity: 0; transform-origin: 50% 50%; transform: translateY(-460px) scale(2.4, 2.2);
             animation: condense .75s var(--ease-out-soft) forwards; animation-delay: var(--d); }
  .s3 .glyph { transform: translateY(14px);
               animation: rise .5s var(--ease-out-soft) forwards; animation-delay: calc(1.95s + var(--i) * 28ms); }
  .s3 .tag { transform: translateY(6px); animation: rise .5s var(--ease-out-soft) 2.4s forwards; }

  @keyframes climb    { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes draw     { to { stroke-dashoffset: 0; } }
  @keyframes drift    { 0% { opacity: 0; transform: translateY(-140px); } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(820px); } }
  @keyframes condense { 0% { opacity: 0; } 30% { opacity: .35; } 100% { opacity: 1; transform: translateY(0) scale(1, 1); } }

  /* ---------- Comuns ---------- */
  @keyframes appear { to { opacity: 1; } }
  @keyframes vanish { to { opacity: 0; } }
  @keyframes sweep  { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(260px); } }
  @keyframes pulse  { 0% { opacity: 0; transform: scale(.85); } 45% { opacity: 1; transform: scale(1.05); } 100% { opacity: .45; transform: scale(1.12); } }

  /* Acessibilidade: "reduzir movimento" mostra o logo final com um fade curto */
  @media (prefers-reduced-motion: reduce) {
    .scene *, .scene { animation: none !important; }
    .fx { display: none; }
    .part, .glyph, .tag { opacity: 1 !important; transform: none !important; }
    .scene.active { animation: appear .4s ease-out both !important; }
  }
</style>
</head>

  <script>
    // Revisão: alternar protótipos e reiniciar a animação ao tocar na tela.
    const restart = () => {
      document.querySelectorAll('.scene.active, .stars').forEach((el) => el.replaceWith(el.cloneNode(true)));
    };
    document.querySelectorAll('.picker button').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.picker button').forEach((b) => b.classList.toggle('on', b === btn));
        document.querySelectorAll('.scene').forEach((s) => s.classList.toggle('active', s.classList.contains(btn.dataset.s)));
        restart();
      });
    });
    document.body.addEventListener('click', restart);
  </script>
